<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Comment Counter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="header-brand">
        <div class="logo-box">in</div>
        <span class="header-title">Comment Counter</span>
      </div>
      <span class="version-badge">v1.0</span>
    </div>

    <!-- Progress Card -->
    <div class="card progress-card">
      <div class="card-header">
        <span>Daily Engagement Goal</span>
        <span id="goal-percent-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="popup-progress-fill"></div>
      </div>
      <div class="goal-input-row">
        <label for="goal-input">Daily Target:</label>
        <input type="number" id="goal-input" min="1" max="500" value="20">
        <button id="save-goal-btn" class="btn btn-sm btn-primary">Save</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-num" id="stat-today">0</span>
        <span class="stat-name">Today</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="stat-quality">0</span>
        <span class="stat-name">Quality (>10w)</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="stat-week">0</span>
        <span class="stat-name">This Week</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="stat-month">0</span>
        <span class="stat-name">This Month</span>
      </div>
    </div>

    <!-- Actions Footer -->
    <div class="popup-actions">
      <button id="export-csv-btn" class="btn btn-outline">
        📥 Export Report (.csv)
      </button>
      <button id="reset-data-btn" class="btn btn-danger-link">
        Reset Counter
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
